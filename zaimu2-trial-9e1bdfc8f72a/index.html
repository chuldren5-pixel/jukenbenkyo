<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>銀行業務検定 財務2級 試験対策トレーニング</title>
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --ink: #1d2320;
  --ink-soft: #5b645f;
  --line: #dcd8cf;
  --brand: #1f5f4a;
  --brand-soft: #e3efe9;
  --ok: #1e7a4f;
  --ok-soft: #e2f3ea;
  --ng: #b3392f;
  --ng-soft: #f9e5e2;
  --warn: #8a5a00;
  --warn-soft: #fbf0d9;
  --radius: 10px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141816;
    --surface: #1c211f;
    --ink: #e8ece9;
    --ink-soft: #a3aca7;
    --line: #333a36;
    --brand: #6cc3a0;
    --brand-soft: #1f3129;
    --ok: #6ccf9c;
    --ok-soft: #173025;
    --ng: #ef8a80;
    --ng-soft: #3a1d1a;
    --warn: #e7bb5f;
    --warn-soft: #352a12;
    color-scheme: dark;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo,
    system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}

a {
  color: var(--brand);
}

.shell {
  max-width: 760px;
  margin: 0 auto;
  padding: 16px 16px 64px;
}

h1 {
  font-size: 1.35rem;
  margin: 8px 0 4px;
  line-height: 1.4;
}

h2 {
  font-size: 1.05rem;
  margin: 24px 0 8px;
}

.muted {
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin: 12px 0;
}

.banner {
  border-radius: var(--radius);
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 0.9rem;
}
.banner.warn {
  background: var(--warn-soft);
  color: var(--warn);
}
.banner.info {
  background: var(--brand-soft);
  color: var(--brand);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid var(--brand);
  background: var(--brand);
  color: var(--surface);
  font: inherit;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}
.btn.secondary {
  background: transparent;
  color: var(--brand);
}
.btn.quiet {
  background: transparent;
  border-color: var(--line);
  color: var(--ink-soft);
  font-weight: 500;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.spread {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.menu {
  display: grid;
  gap: 10px;
}
.menu a {
  display: block;
  text-decoration: none;
  color: inherit;
}
.menu .card {
  margin: 0;
}
.menu .card:hover {
  border-color: var(--brand);
}

select {
  font: inherit;
  min-height: 44px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  max-width: 100%;
}

/* 問題 */
.stem {
  white-space: pre-wrap;
  margin: 8px 0 12px;
}
.choices {
  display: grid;
  gap: 8px;
  list-style: none;
  padding: 0;
  margin: 0;
}
.choice {
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  min-height: 44px;
  cursor: pointer;
}
.choice[aria-pressed="true"] {
  border-color: var(--brand);
  background: var(--brand-soft);
  font-weight: 600;
}
.choice.correct {
  border-color: var(--ok);
  background: var(--ok-soft);
}
.choice.wrong {
  border-color: var(--ng);
  background: var(--ng-soft);
}
.choice:disabled {
  cursor: default;
}

.verdict {
  font-weight: 700;
  margin: 12px 0 4px;
}
.verdict.ok {
  color: var(--ok);
}
.verdict.ng {
  color: var(--ng);
}

.explain {
  border-top: 1px dashed var(--line);
  margin-top: 12px;
  padding-top: 10px;
  font-size: 0.95rem;
}

.note {
  background: var(--warn-soft);
  color: var(--warn);
  border-radius: 8px;
  padding: 8px 10px;
  margin: 8px 0;
  font-size: 0.9rem;
}

.tag {
  display: inline-block;
  font-size: 0.75rem;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand);
  margin-right: 4px;
}

/* 本試験 */
.examBar {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg);
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.timer {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 1.1rem;
}
.timer.low {
  color: var(--ng);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
  gap: 6px;
  margin: 12px 0;
}
.cell {
  font: inherit;
  font-size: 0.85rem;
  min-height: 40px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
  cursor: pointer;
}
.cell.done {
  background: var(--brand-soft);
  color: var(--brand);
  border-color: var(--brand-soft);
}
.cell.now {
  outline: 2px solid var(--brand);
}

/* 結果 */
.result {
  font-size: 1.6rem;
  font-weight: 800;
}
.result.pass {
  color: var(--ok);
}
.result.fail {
  color: var(--ng);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}
th,
td {
  text-align: left;
  padding: 8px 6px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
td.num,
th.num {
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
/* 設例の表：表だけ横にスクロールさせる（ページ全体は横にはみ出さない） */
.caseBox {
  margin: 8px 0;
  min-width: 0;
}
.tableScroll {
  max-width: 100%;
  overflow-x: auto;
  margin: 6px 0;
}
.tableScroll table {
  width: max-content;
  min-width: 100%;
}
.tableScroll th,
.tableScroll td {
  white-space: nowrap;
}
.tableScroll caption {
  text-align: left;
  font-size: 0.85rem;
  color: var(--ink-soft);
  padding: 0 0 4px;
}
.numeric input {
  font: inherit;
  width: 12em;
  max-width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
}
.ok-text {
  color: var(--ok);
  font-weight: 600;
}
.ng-text {
  color: var(--ng);
  font-weight: 600;
}

.bar {
  height: 8px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.bar > span {
  display: block;
  height: 100%;
  background: var(--brand);
}

dialog {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  max-width: min(420px, calc(100vw - 32px));
}
dialog::backdrop {
  background: rgba(0, 0, 0, 0.35);
}

:root[data-theme="dark"] {
    --bg: #141816;
    --surface: #1c211f;
    --ink: #e8ece9;
    --ink-soft: #a3aca7;
    --line: #333a36;
    --brand: #6cc3a0;
    --brand-soft: #1f3129;
    --ok: #6ccf9c;
    --ok-soft: #173025;
    --ng: #ef8a80;
    --ng-soft: #3a1d1a;
    --warn: #e7bb5f;
    --warn-soft: #352a12;
    color-scheme: dark;
  }

</style>
